<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Acervo — Livros</title>
  <link rel="stylesheet" href="/css/estilo.css" />
  <script src="/js/layout.js" defer></script>
</head>
<body>
  <main class="container">
  <h1>Acervo de livros</h1>
  <div id="filtros" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;">
  <input id="fTitulo"  placeholder="Buscar por título" />
  <input id="fAutor"   placeholder="Autor" />
  <input id="fEditora" placeholder="Editora" />
  <input id="fAno"     type="number" placeholder="Ano" style="width:90px" />
  <select id="fStatus">
    <option value="">Todos os status</option>
    <option value="DISPONIVEL">Disponível</option>
    <option value="LOCADO">Locado</option>
    <option value="INDISPONIVEL">Indisponível</option>
  </select>
  <label><input type="checkbox" id="fDisponivel" /> Somente disponíveis p/ locação</label>
  <button type="button" id="fLimpar" class="btn">Limpar</button>
</div>

  <div id="grid" class="grid">Carregando...</div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) location.href = '/';
    const authHeaders = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };

    let eu = { perfil: 'USUARIO', permissoes: [] };
    let todosLivros = [];   // lista completa carregada do backend (base para os filtros)
    const pode = (p) => eu.perfil === 'ADMINISTRADOR' || eu.permissoes.includes(p);
    const fmtData = (iso) => iso ? new Date(iso).toLocaleDateString('pt-BR') : '—';

    const STATUS = {
      DISPONIVEL:   { txt: 'Disponível',   cor: '#2e7d32' },
      LOCADO:       { txt: 'Locado',       cor: '#c62828' },
      INDISPONIVEL: { txt: 'Indisponível', cor: '#ef6c00' },
      REMOVIDO:     { txt: 'Removido',     cor: '#616161' },
    };

    async function init() {
      // 1) quem sou eu (para respeitar permissões nas ações)
      const rMe = await fetch('/auth/me', { headers: authHeaders });
      if (rMe.ok) eu = await rMe.json();

      // 2) livros
      const rL = await fetch('/livros', { headers: authHeaders });
      todosLivros = await rL.json();
      aplicarFiltros();
    }

    function render(livros) {
      const grid = document.getElementById('grid');
      if (!livros.length) { grid.textContent = 'Nenhum livro encontrado.'; return; }
      grid.innerHTML = '';

      livros.forEach((l) => {
        const disponivel = l.status === 'DISPONIVEL';
        const s = STATUS[l.status] ?? STATUS.INDISPONIVEL;
        let statusHtml = `<span class="badge" style="background:${s.cor}">${s.txt}</span>`;
        if (l.status === 'DISPONIVEL') statusHtml += ` (${l.exemplaresDisponiveis}/${l.totalExemplares})`;
        if (l.status === 'LOCADO')     statusHtml += ` — disponível a partir de ${fmtData(l.dataPrevistaDisponibilidade)}`;

        // ações conforme permissão (locar/excluir são de issues futuras)
        const acoes = [];
        if (pode('LOCAR_LIVROS') && disponivel) acoes.push(`<button class="btn btn-primario" onclick="locar(${l.id})">Locar</button>`);
        if (pode('CADASTRAR_LIVROS'))           acoes.push(`<button class="btn" onclick="addExemplar(${l.id})">+ Exemplar</button>`);
        if (eu.perfil === 'ADMINISTRADOR')      acoes.push(`<button class="btn btn-perigo" onclick="excluir(${l.id}, '${l.titulo.replace(/'/g, "\\'")}')">Excluir</button>`);

        const card = document.createElement('div');
        card.className = 'card';
        card.tabIndex = 0;   // permite foco por teclado (focus-within revela ações)
        card.innerHTML = `
          <h3>${l.titulo}</h3>
          <p><strong>Autor(es):</strong> ${l.autor}</p>
          <p><strong>Editora:</strong> ${l.editora ?? '—'}</p>
          <p><strong>Ano:</strong> ${l.anoPublicacao ?? '—'} &nbsp; <strong>Edição:</strong> ${l.edicao ?? '—'}</p>
          <p>${statusHtml}</p>
          <div class="acoes">${acoes.join('') || '<em>Sem ações disponíveis</em>'}</div>`;
        grid.appendChild(card);
      });
    }

    // "+ Exemplar" já funciona (endpoint da ISSUE 10). Locar/Excluir ficam para issues futuras.
    async function addExemplar(id) {
      const qtd = Number(prompt('Quantos exemplares adicionar?', '1'));
      if (!qtd) return;
      const r = await fetch(`/livros/${id}/exemplares`, { method: 'POST', headers: authHeaders, body: JSON.stringify({ quantidade: qtd }) });
      const d = await r.json();
      mensagem(r.ok ? `Total de exemplares: ${d.totalExemplares}` : (d.erro || 'Falha'), r.ok ? 'sucesso' : 'erro');
      if (r.ok) init();
    }
    function locar(id) { location.href = `/locacao.html?livroId=${id}`; }
    //function excluir(id) { alert('Exclusão será implementada em issue futura (permissão EXCLUIR_LIVROS).'); }

    async function excluir(id, titulo){
      if(!confirm(`Remover o livro "${titulo}" do acervo?`)) return;

      const resp = await fetch(`/livros/${id}`, { method: 'DELETE', headers: authHeaders });
      const dados = await resp.json();
      if(!resp.ok){
        mensagem((dados.erro || '').trim() === 'Você não tem permissão para esta ação'
          ? 'Apenas administradores podem excluir livros.'
          : (dados.erro || 'Falha ao excluir'), 'erro');
        return;
      }
      mensagem('Livro removido do acervo.', 'sucesso');
      init();
    }

    function aplicarFiltros() {
  const t      = document.getElementById('fTitulo').value.trim().toLowerCase();
  const a      = document.getElementById('fAutor').value.trim().toLowerCase();
  const e      = document.getElementById('fEditora').value.trim().toLowerCase();
  const ano    = document.getElementById('fAno').value.trim();
  const status = document.getElementById('fStatus').value;
  const soDisp = document.getElementById('fDisponivel').checked;

  const filtrados = todosLivros.filter((l) => {
    if (t && !(l.titulo  || '').toLowerCase().includes(t)) return false;   // busca por título
    if (a && !(l.autor   || '').toLowerCase().includes(a)) return false;   // autor
    if (e && !(l.editora || '').toLowerCase().includes(e)) return false;   // editora
    if (ano && String(l.anoPublicacao ?? '') !== ano)      return false;   // ano (exato)
    if (status && l.status !== status)                     return false;   // status
    if (soDisp && l.status !== 'DISPONIVEL')               return false;   // só disponíveis
    return true;
  });

  render(filtrados);
}


    // atualização sem recarregar: cada mudança nos filtros re-renderiza a partir de todosLivros
    ['fTitulo','fAutor','fEditora','fAno','fStatus','fDisponivel'].forEach((id) => {
      const el = document.getElementById(id);
      el.addEventListener('input', aplicarFiltros);
      el.addEventListener('change', aplicarFiltros);
    });
    document.getElementById('fLimpar').addEventListener('click', () => {
      ['fTitulo','fAutor','fEditora','fAno'].forEach((id) => (document.getElementById(id).value = ''));
      document.getElementById('fStatus').value = '';
      document.getElementById('fDisponivel').checked = false;
      aplicarFiltros();
    });

    init();
  </script>
  </main>
</body>
</html>
