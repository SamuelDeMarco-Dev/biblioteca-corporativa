<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Nova senha</title>
  <link rel="stylesheet" href="/css/estilo.css" />
  <script src="/js/layout.js" defer></script>
</head>
<body>
  <main class="form-centro">
    <form id="form" class="form">
      <h1>Definir nova senha</h1>
      <label for="senha">Nova senha (mín. 6)</label>
      <input type="password" id="senha" placeholder="Nova senha" required />
      <button type="submit" class="btn btn-primario">Salvar</button>
    </form>
  </main>

  <script>
    const token = new URLSearchParams(location.search).get('token');
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const resp = await fetch('/auth/redefinir-senha', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, novaSenha: document.getElementById('senha').value }),
      });
      const dados = await resp.json();
      if (!resp.ok) { mensagem(dados.erro || 'Falha ao redefinir', 'erro'); return; }
      mensagem('Senha redefinida! Redirecionando para o login...', 'sucesso');
      setTimeout(() => (location.href = '/'), 1500);
    });
  </script>
</body>
</html>
