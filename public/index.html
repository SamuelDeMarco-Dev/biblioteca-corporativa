<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Login — Biblioteca Interna</title>
  <link rel="stylesheet" href="/css/estilo.css" />
  <script src="/js/layout.js" defer></script>
</head>
<body>
  <main class="form-centro">
    <form id="loginForm" class="form">
      <h1>📚 Biblioteca Interna</h1>
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="E-mail" required />
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Senha" required />
      <button type="submit" class="btn btn-primario">Entrar</button>
      <p style="margin-top:12px"><a href="/esqueci-senha.html">Esqueci minha senha</a></p>
    </form>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      window.limparErros(e.target);

      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;

      // validação local imediata
      const erros = {};
      if (!window.validacoes.email(email)) erros.email = 'E-mail inválido';
      if (!senha) erros.senha = 'Senha é obrigatória';
      if (Object.keys(erros).length) { window.aplicarErros(erros, e.target); return; }

      const resp = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, senha }),
      });
      const dados = await resp.json();
      if (!resp.ok) {
        window.aplicarErros(dados.campos, e.target);
        mensagem(dados.erro || 'Falha no login', 'erro');
        return;
      }
      localStorage.setItem('token', dados.token);
      localStorage.setItem('usuario', JSON.stringify(dados.usuario));
      window.location.href = '/home.html';
    });
  </script>
</body>
</html>
