<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" /><title>Minhas locações</title>
  <link rel="stylesheet" href="/css/estilo.css" />
  <script type="module" src="/js/pages/minhas-locacoes.js"></script>
  <style>
    .badge.ATIVA { background: var(--sucesso); }
    .badge.ATRASADA { background: var(--erro); }
    .badge.DEVOLVIDA { background: #7b8794; }
  </style>
</head>
<body>
  <main class="container">
    <h1 id="titulo">Minhas locações</h1>

    <section class="painel painel-tabela">
      <div class="painel-head"><h2>Ativas</h2><span class="contador" id="contAtivas">0</span></div>
      <div class="tabela-scroll">
        <table><thead><tr id="thAtivas"></tr></thead><tbody id="ativas"></tbody></table>
      </div>
    </section>

    <section class="painel painel-tabela">
      <div class="painel-head"><h2>Histórico (devolvidas)</h2><span class="contador" id="contHist">0</span></div>
      <div class="tabela-scroll">
        <table><thead><tr id="thHist"></tr></thead><tbody id="historico"></tbody></table>
      </div>
    </section>
  </main>
</body>
</html>
