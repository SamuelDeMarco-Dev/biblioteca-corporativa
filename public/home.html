<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Início — Biblioteca</title>
  <link rel="stylesheet" href="/css/estilo.css" />
  <script src="/js/layout.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Bem-vindo(a), <span id="nome"></span>!</h1>
    <p>Use o menu acima para navegar pelo acervo, suas locações e as áreas administrativas.</p>
  </main>

  <script>
    const usuario = JSON.parse(localStorage.getItem('usuario') || 'null');
    if (!usuario) window.location.href = '/';
    else document.getElementById('nome').textContent = usuario.nome;
  </script>
</body>
</html>
