<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Início — Biblioteca</title>
  <link rel="stylesheet" href="/css/estilo.css" />
  <script type="module" src="/js/pages/home.js"></script>
  <style> .stat { text-align: left; } </style>
</head>
<body>
  <main class="container">
    <h1 id="titulo">Início</h1>

    <!-- Painel do administrador: indicadores (dashboard) -->
    <div id="painelAdmin" hidden>
      <div class="cards" id="cards"></div>

      <div class="dash-grid">
        <section class="painel">
          <h2>Ranking de usuários</h2>
          <p class="dash-destaque" id="topUsuario">—</p>
          <div class="grafico-barras" id="ranking"></div>
        </section>

        <section class="painel">
          <h2>Situação do acervo</h2>
          <div class="donut-wrap">
            <div class="donut" id="donut"></div>
            <div class="donut-legenda" id="donutLeg"></div>
          </div>
        </section>
      </div>

      <section class="painel painel-tabela">
        <div class="painel-head"><div class="head-esq"><h2>Últimas locações</h2></div></div>
        <div class="tabela-scroll">
          <table>
            <thead><tr><th>Livro</th><th>Usuário</th><th>Data</th><th>Prazo</th><th>Situação</th></tr></thead>
            <tbody id="ultimas"></tbody>
          </table>
        </div>
      </section>
    </div>

    <!-- Painel do usuário comum -->
    <div id="painelComum" hidden>
      <section class="painel">
        <h2>Bem-vindo(a), <span id="nomeComum"></span>!</h2>
        <p>Acesse o acervo para consultar e locar livros, ou acompanhe suas locações em andamento.</p>
        <div class="acoes" style="display:flex">
          <a class="btn btn-primario" href="/livros.html">Ir para o acervo</a>
          <a class="btn" href="/minhas-locacoes.html">Minhas locações</a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
