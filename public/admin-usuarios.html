<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" /><title>Gerenciar usuários</title>
  <link rel="stylesheet" href="/css/estilo.css" />
  <script src="/js/layout.js" defer></script>
  <style>
    fieldset { border: 1px solid var(--borda); border-radius: var(--raio); background: var(--card); margin-bottom: 12px; padding: 12px; }
    fieldset input, fieldset select { width: auto; display: inline-block; margin-right: 8px; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Gerenciar usuários</h1>

    <fieldset>
      <legend>Cadastrar novo usuário</legend>
      <form id="formNovo" class="form" novalidate>
        <label for="nome">Nome</label>
        <input id="nome" placeholder="Nome completo" />
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="email@empresa.com" />
        <label for="cpf">CPF</label>
        <input id="cpf" inputmode="numeric" maxlength="11" placeholder="Somente números (11 dígitos)" />
        <label for="senha">Senha</label>
        <input id="senha" type="password" placeholder="Mínimo 6 caracteres" />
        <label for="setor">Setor</label>
        <select id="setor">
          <option value="SUPORTE">Suporte</option>
          <option value="SERVICOS">Serviços</option>
          <option value="SANCONHUB">SanconHub</option>
          <option value="ADMINISTRATIVO">Administrativo</option>
          <option value="COMERCIAL">Comercial</option>
          <option value="MARKETING">Marketing</option>
          <option value="TI">TI</option>
          <option value="RH">RH</option>
          <option value="DIRETORIA">Diretoria</option>
        </select>
        <label for="perfil">Perfil</label>
        <select id="perfil">
          <option value="USUARIO">Usuário</option>
          <option value="ADMINISTRADOR">Administrador</option>
        </select>
        <button type="submit" class="btn btn-primario">Cadastrar usuário</button>
      </form>
    </fieldset>

    <div id="lista">Carregando...</div>
  </main>

  <script>
    const token = localStorage.getItem('token');
    const authHeaders = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
    const confirmar = (texto, tipo = 'sucesso') => mensagem(texto, tipo);

    let permissoes = [];

    async function carregar() {
      // gate no cliente pela fonte confiável (/auth/me); o backend também bloqueia
      if (!(await window.exigirAcesso({ admin: true }))) return;

      const [rU, rP] = await Promise.all([
        fetch('/usuarios',   { headers: authHeaders }),
        fetch('/permissoes', { headers: authHeaders }),
      ]);
      if (rU.status === 403) { location.href = '/home.html'; return; }
      const usuarios = await rU.json();
      permissoes = await rP.json();
      render(usuarios);
    }

    function render(usuarios) {
      const div = document.getElementById('lista');
      div.innerHTML = '';
      usuarios.forEach((u) => {
        const nomesDoUsuario = new Set(u.permissoes.map((p) => p.nome));
        const checks = permissoes.map((p) => `
          <label style="display:inline-block;margin-right:8px;font-weight:normal">
            <input type="checkbox" data-uid="${u.id}" data-pid="${p.id}" ${nomesDoUsuario.has(p.nome) ? 'checked' : ''} />
            ${p.nome}
          </label>`).join('');

        div.innerHTML += `
          <fieldset>
            <legend>#${u.id} — ${u.email}</legend>
            <input id="nome-${u.id}" value="${u.nome}" placeholder="Nome" />
            <select id="perfil-${u.id}">
              <option value="USUARIO"       ${u.perfil === 'USUARIO' ? 'selected' : ''}>USUARIO</option>
              <option value="ADMINISTRADOR" ${u.perfil === 'ADMINISTRADOR' ? 'selected' : ''}>ADMINISTRADOR</option>
            </select>
            <button class="btn btn-primario" onclick="salvarDados(${u.id})">Salvar dados</button>
            <div style="margin-top:10px">${checks}</div>
          </fieldset>`;
      });

      div.querySelectorAll('input[type=checkbox]').forEach((cb) => {
        cb.addEventListener('change', () => togglePermissao(cb));
      });
    }

    async function salvarDados(id) {
      const body = {
        nome:   document.getElementById(`nome-${id}`).value,
        perfil: document.getElementById(`perfil-${id}`).value,
      };
      const resp = await fetch(`/usuarios/${id}`, { method: 'PATCH', headers: authHeaders, body: JSON.stringify(body) });
      const dados = await resp.json();
      if (!resp.ok) return confirmar(dados.erro || 'Falha ao salvar', 'erro');
      confirmar(`Dados do usuário #${id} atualizados com sucesso.`);
    }

    async function togglePermissao(cb) {
      const uid = Number(cb.dataset.uid), pid = Number(cb.dataset.pid);
      const body = cb.checked ? { habilitar: [pid] } : { desabilitar: [pid] };
      const resp = await fetch(`/usuarios/${uid}/permissoes`, { method: 'PATCH', headers: authHeaders, body: JSON.stringify(body) });
      const dados = await resp.json();
      if (!resp.ok) { cb.checked = !cb.checked; return confirmar(dados.erro || 'Falha na permissão', 'erro'); }
      confirmar(`Permissão ${cb.checked ? 'habilitada' : 'desabilitada'} para o usuário #${uid}.`);
    }

    // Validação local dos campos obrigatórios antes de enviar ao backend.
    // Retorna { campo: mensagem } (mesmo formato do backend) ou null se tudo ok.
    function validarNovoUsuario(d) {
      const erros = {};
      if (!d.nome.trim())                erros.nome  = 'Nome é obrigatório';
      if (!window.validacoes.email(d.email)) erros.email = 'E-mail inválido';
      if (!window.validacoes.cpf(d.cpf))     erros.cpf   = 'CPF inválido';
      if ((d.senha || '').length < 6)    erros.senha = 'Senha deve ter ao menos 6 caracteres';
      return Object.keys(erros).length ? erros : null;
    }

    async function cadastrarUsuario(e) {
      e.preventDefault();
      window.limparErros(document.getElementById('formNovo'));

      const dados = {
        nome:   document.getElementById('nome').value,
        email:  document.getElementById('email').value.trim(),
        cpf:    document.getElementById('cpf').value.replace(/\D/g, ''),
        senha:  document.getElementById('senha').value,
        setor:  document.getElementById('setor').value,
        perfil: document.getElementById('perfil').value,
      };

      const errosLocais = validarNovoUsuario(dados);
      if (errosLocais) { window.aplicarErros(errosLocais); return; }

      const resp = await fetch('/usuarios', { method: 'POST', headers: authHeaders, body: JSON.stringify(dados) });
      const resposta = await resp.json();
      if (!resp.ok) {
        // destaca campos vindos do backend (validação/duplicidade) e mostra a mensagem
        window.aplicarErros(resposta.campos, document.getElementById('formNovo'));
        confirmar(resposta.erro || 'Falha ao cadastrar usuário', 'erro');
        return;
      }
      confirmar(`Usuário "${resposta.nome}" cadastrado com sucesso.`);
      document.getElementById('formNovo').reset();
      carregar();
    }

    // aguarda o layout.js (defer) carregar antes de usar window.exigirAcesso
    document.addEventListener('DOMContentLoaded', () => {
      carregar();
      document.getElementById('formNovo').addEventListener('submit', cadastrarUsuario);
    });
  </script>
</body>
</html>
