<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" /><title>Gerenciar usuários</title>
  <link rel="icon" href="/img/sancon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/estilo.css" />
  <script type="module" src="/js/pages/usuarios.js"></script>
</head>
<body>
  <main class="container">
    <h1>Gerenciar usuários</h1>

    <section class="painel painel-tabela">
      <div class="painel-head">
        <div class="head-esq"><h2>Usuários</h2><span class="contador" id="contUsuarios">0</span></div>
        <button id="btnNovoUsuario" class="btn btn-primario">+ Novo usuário</button>
      </div>
      <div class="tabela-scroll">
        <table>
          <thead><tr><th>#</th><th>E-mail</th><th>Nome</th><th>Perfil</th><th>Permissões</th><th></th></tr></thead>
          <tbody id="lista"><tr><td class="vazio" colspan="6">Carregando...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
