<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Recuperar senha</title>
  <link rel="stylesheet" href="/css/estilo.css" />
  <script src="/js/layout.js" defer></script>
</head>
<body>
  <main class="form-centro">
    <form id="form" class="form">
      <h1>Recuperar senha</h1>
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="Seu e-mail" required />
      <button type="submit" class="btn btn-primario">Enviar link</button>
      <p style="margin-top:12px"><a href="/">Voltar ao login</a></p>
    </form>
  </main>

  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const resp = await fetch('/auth/esqueci-senha', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value }),
      });
      const dados = await resp.json();
      if (!resp.ok) { mensagem(dados.erro || 'Falha na solicitação', 'erro'); return; }
      mensagem('Se o e-mail estiver cadastrado, enviamos um link de redefinição.', 'sucesso');
    });
  </script>
</body>
</html>
