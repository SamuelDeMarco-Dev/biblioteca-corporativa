<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Cadastrar livro</title>
  <link rel="stylesheet" href="/css/estilo.css" />
  <script src="/js/layout.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Cadastrar livro</h1>
    <form id="form" class="form">
      <label for="titulo">Título</label>
      <input id="titulo" placeholder="Título" required autocomplete="off" />
      <div id="sugestoes" class="card" style="display:none; padding:0; max-height:200px; overflow:auto; margin-top:4px;"></div>
      <small id="apiAviso" style="color:var(--aviso); display:none;">Sugestões indisponíveis no momento — você pode cadastrar manualmente.</small>

      <label for="autor">Autor(es)</label>
      <input id="autor" placeholder="Autor(es)" required />
      <label for="editora">Editora</label>
      <input id="editora" placeholder="Editora" required />
      <label for="anoPublicacao">Ano de publicação</label>
      <input id="anoPublicacao" type="number" placeholder="Ano de publicação" required />
      <label for="edicao">Edição</label>
      <input id="edicao" placeholder="Edição" required />
      <label for="observacao">Observação</label>
      <input id="observacao" placeholder="Observação" required />
      <label for="isbn">ISBN (opcional)</label>
      <input id="isbn" placeholder="ISBN" />
      <label for="quantidadeExemplares">Quantidade de exemplares</label>
      <input id="quantidadeExemplares" type="number" min="1" value="1" required />
      <button type="submit" class="btn btn-primario">Salvar</button>
    </form>

    <div id="duplicadoAlerta" class="alerta aviso" style="display:none">
      <p id="duplicadoTexto"></p>
      <button id="btnAdicionar" type="button" class="btn btn-primario">Adicionar os exemplares ao livro existente</button>
    </div>
  </main>

  <script>
    const token = localStorage.getItem('token');
    if (!token) location.href = '/';

    // gate no cliente: só quem tem CADASTRAR_LIVROS acessa a página (o backend também bloqueia).
    // roda no DOMContentLoaded para garantir que o layout.js (defer) já expôs window.exigirAcesso.
    document.addEventListener('DOMContentLoaded', () => window.exigirAcesso({ permissao: 'CADASTRAR_LIVROS' }));

    const authHeaders = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
    const alerta = document.getElementById('duplicadoAlerta');
    const btnAdicionar = document.getElementById('btnAdicionar');

    const inputTitulo = document.getElementById('titulo');
    const boxSugestoes = document.getElementById('sugestoes');
    const apiAviso = document.getElementById('apiAviso');
    let debounceTimer;

    inputTitulo.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      const termo = inputTitulo.value.trim();
      if (termo.length < 2) { boxSugestoes.style.display = 'none'; return; }
      debounceTimer = setTimeout(() => buscarSugestoes(termo), 300);
    });

    async function buscarSugestoes(termo) {
      apiAviso.style.display = 'none';
      try {
        const resp = await fetch(`/livros/buscar-externo?titulo=${encodeURIComponent(termo)}`, { headers: authHeaders });
        const dados = await resp.json();
        if (dados.indisponivel) { apiAviso.style.display = 'block'; boxSugestoes.style.display = 'none'; return; }
        renderSugestoes(dados.sugestoes);
      } catch {
        apiAviso.style.display = 'block';
        boxSugestoes.style.display = 'none';
      }
    }

    function renderSugestoes(lista) {
      if (!lista.length) { boxSugestoes.style.display = 'none'; return; }
      boxSugestoes.innerHTML = '';
      lista.forEach((s) => {
        const item = document.createElement('div');
        item.style.cssText = 'padding:8px; cursor:pointer; border-bottom:1px solid var(--borda);';
        item.textContent = `${s.titulo}${s.autor ? ' — ' + s.autor : ''}${s.anoPublicacao ? ' (' + s.anoPublicacao + ')' : ''}`;
        item.onmouseover = () => item.style.background = '#eef';
        item.onmouseout  = () => item.style.background = '';
        item.onclick = () => preencher(s);
        boxSugestoes.appendChild(item);
      });
      boxSugestoes.style.display = 'block';
    }

    function preencher(s) {
      inputTitulo.value = s.titulo || '';
      document.getElementById('autor').value = s.autor || '';
      document.getElementById('editora').value = s.editora || '';
      if (s.anoPublicacao) document.getElementById('anoPublicacao').value = s.anoPublicacao;
      if (s.isbn) document.getElementById('isbn').value = s.isbn;
      boxSugestoes.style.display = 'none';
    }

    document.addEventListener('click', (e) => {
      if (!boxSugestoes.contains(e.target) && e.target !== inputTitulo) boxSugestoes.style.display = 'none';
    });

    function lerFormulario() {
      return {
        titulo:        document.getElementById('titulo').value,
        autor:         document.getElementById('autor').value,
        editora:       document.getElementById('editora').value,
        anoPublicacao: Number(document.getElementById('anoPublicacao').value),
        edicao:        document.getElementById('edicao').value,
        observacao:    document.getElementById('observacao').value,
        isbn:          document.getElementById('isbn').value || undefined,
        quantidadeExemplares: Number(document.getElementById('quantidadeExemplares').value),
      };
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      alerta.style.display = 'none';
      window.limparErros(e.target);
      const body = lerFormulario();

      const resp = await fetch('/livros', { method: 'POST', headers: authHeaders, body: JSON.stringify(body) });
      const dados = await resp.json();

      if (resp.status === 409 && dados.duplicado) {
        alerta.style.display = 'block';
        document.getElementById('duplicadoTexto').textContent =
          `O livro "${dados.livro.titulo}" já está cadastrado (${dados.exemplaresDisponiveis} de ${dados.totalExemplares} exemplar(es) disponível(is)). ` +
          `Deseja adicionar ${body.quantidadeExemplares} novo(s) exemplar(es) a ele?`;
        btnAdicionar.onclick = () => adicionarExemplares(dados.livro.id, body.quantidadeExemplares);
        return;
      }

      if (!resp.ok) {
        window.aplicarErros(dados.campos, e.target);
        mensagem((dados.erro || '').trim() === 'Você não tem permissão para esta ação'
          ? 'Você não tem permissão para cadastrar livros.'
          : (dados.erro || 'Falha ao cadastrar'), 'erro');
        return;
      }

      mensagem(`Livro "${dados.titulo}" cadastrado com ${dados.exemplares.length} exemplar(es).`, 'sucesso');
      e.target.reset();
      document.getElementById('quantidadeExemplares').value = 1;
    });

    async function adicionarExemplares(livroId, quantidade) {
      const resp = await fetch(`/livros/${livroId}/exemplares`, { method: 'POST', headers: authHeaders, body: JSON.stringify({ quantidade }) });
      const dados = await resp.json();
      alerta.style.display = 'none';
      if (!resp.ok) { mensagem(dados.erro || 'Falha ao adicionar exemplares', 'erro'); return; }
      mensagem(`Exemplares adicionados. Total agora: ${dados.totalExemplares} (${dados.exemplaresDisponiveis} disponível(is) para locação).`, 'sucesso');
    }
  </script>
</body>
</html>
