name: CI

on:
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

# Cancela runs antigos do mesmo PR quando chega push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Prisma validate
        run: npx prisma validate

      - name: Test (with coverage)
        run: npm run test

      - name: Build
        run: npm run build
